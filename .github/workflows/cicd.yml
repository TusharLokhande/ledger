name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write # GITHUB_TOKEN pushes to ghcr.io

env:
  API_IMAGE: ghcr.io/tusharlokhande/pocketledger-api
  CLIENT_IMAGE: ghcr.io/tusharlokhande/pocketledger-client
  SITE_URL: https://ledger.efficanova.com

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/client/package-lock.json
      - name: Client lint + build
        working-directory: src/client
        run: |
          npm ci
          npm run lint
          npm run build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Server build
        run: dotnet build src/server/Ledger.slnx -c Release

  images:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: src/server
          push: ${{ github.event_name == 'push' }} # PRs only prove the image builds
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Client image
        uses: docker/build-push-action@v6
        with:
          context: src/client
          push: ${{ github.event_name == 'push' }}
          build-args: VITE_API_BASE_URL=${{ env.SITE_URL }}
          tags: |
            ${{ env.CLIENT_IMAGE }}:latest
            ${{ env.CLIENT_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: images
    if: github.event_name == 'push'
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false # never kill a deploy halfway
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo "${{ vars.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy
        run: |
          scp -i ~/.ssh/deploy -P 2222 deploy/compose.yaml deploy/backup.sh deploy@ssh.tushar.sbs:/opt/apps/pocket-ledger/
          # Pin this commit's images in .env, so a racing push, a reboot or a manual `up` can't run another build.
          ssh -i ~/.ssh/deploy -p 2222 deploy@ssh.tushar.sbs bash -s -- "sha-${{ github.sha }}" <<'EOF'
            set -e
            cd /opt/apps/pocket-ledger
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$1/" .env
            chmod +x backup.sh
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
          EOF

      - name: Check site and API are up
        run: |
          for i in $(seq 12); do
            web=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/")
            api=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$SITE_URL/api/auth/refresh")
            echo "try $i: web=$web api=$api"
            if [ "$web" = 200 ] && [ "$api" = 401 ]; then exit 0; fi
            sleep 5
          done
          echo "Site or API not healthy after deploy" >&2
          exit 1
